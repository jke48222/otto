# Builds Otto and runs the unit tests on every push and pull request to main.
#
# Runner: macos-26 (Apple silicon) is the newest generally available macOS image. Xcode 27 is only a
# public preview on its own image, so we stay on the newest *stable* Xcode that setup-xcode finds.
# The app targets macOS 14 and uses no SDK-gated APIs, so any Xcode 16 or later builds it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Otto.xcodeproj
        run: xcodegen generate --spec project.yml

      # Ad hoc signing: CI has no Apple Development identity, and none is needed to build or test.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Otto.xcodeproj \
            -scheme Otto \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: build/TestResults.xcresult
          retention-days: 7

  # The license and flavor machinery (SPEC-v2 §14.17.3): script tests found by glob, the licensing-check build's
  # full test suite, and a source Release build audited for anything a flavor adds. No packages are resolved here.
  licensing:
    name: Licensing check
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Otto.xcodeproj
        run: xcodegen generate --spec project.yml

      - name: Script tests
        run: |
          for t in scripts/tests/*_test.sh; do bash "$t" || exit 1; done

      - name: Node tests
        run: |
          if compgen -G 'scripts/tests/*.test.mjs' > /dev/null; then node --test scripts/tests/*.test.mjs; fi

      # Ad hoc signing, as in the build-and-test job.
      - name: Licensing-check build and test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Otto.xcodeproj \
            -scheme Otto \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/licensing \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=NO \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG OTTO_LICENSING' \
            test 2>&1 | tee build/licensing-test.log
          grep -q "Test Suite 'LicensePolicyTests' passed" build/licensing-test.log

      - name: Source Release build and flavor audit
        run: |
          set -o pipefail
          xcodebuild \
            -project Otto.xcodeproj \
            -scheme Otto \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/release-source \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build
          scripts/audit_flavor.sh --flavor source build/release-source/Build/Products/Release/Otto.app

  # The paid and Setapp builds, each generated from its own spec with its one pinned package.
  flavors:
    name: Flavor ${{ matrix.flavor }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [paid, setapp]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate every project and check the tree stays clean
        run: |
          xcodegen generate
          xcodegen generate --spec project-paid.yml
          xcodegen generate --spec project-setapp.yml
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('project-paid.yml', 'project-setapp.yml') }}

      - name: Name the project
        run: |
          case "$FLAVOR" in
            paid) echo "PROJECT=OttoPaid.xcodeproj" >> "$GITHUB_ENV" ;;
            setapp) echo "PROJECT=OttoSetapp.xcodeproj" >> "$GITHUB_ENV" ;;
          esac

      # An ad hoc, hardened test host can refuse to load the ad hoc Sparkle.framework under library validation, so
      # this step alone turns the hardened runtime off. Release builds keep it.
      - name: Paid Debug test
        if: matrix.flavor == 'paid'
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme Otto \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/paid \
            -clonedSourcePackagesDirPath build/spm \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            test

      - name: Setapp Debug build
        if: matrix.flavor == 'setapp'
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme Otto \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/setapp \
            -clonedSourcePackagesDirPath build/spm \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_REQUIRED=NO \
            build

      # (a) With the committed configuration, the Release build fails if and only if the checker reports a problem,
      # and a failing build's log carries every error line the checker printed.
      - name: Loud failure with the committed configuration
        run: |
          checker_status=0
          scripts/check_commercial_config.sh --flavor "$FLAVOR" --configuration Release \
            --xcconfig Config/Commercial.xcconfig > build/checker.log || checker_status=$?
          cat build/checker.log
          build_status=0
          xcodebuild \
            -project "$PROJECT" \
            -scheme Otto \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "build/release-committed-$FLAVOR" \
            -clonedSourcePackagesDirPath build/spm \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build > build/release-committed.log 2>&1 || build_status=$?
          tail -n 40 build/release-committed.log
          if [ "$checker_status" -eq 1 ]; then
            test "$build_status" -ne 0 || { echo "The checker reported problems but the Release build succeeded."; exit 1; }
            grep '^error: ' build/checker.log | while IFS= read -r line; do
              grep -qF -- "$line" build/release-committed.log || { echo "Missing from the build log: $line"; exit 1; }
            done
          else
            test "$checker_status" -eq 0 || exit 1
            test "$build_status" -eq 0 || { echo "The checker passed but the Release build failed."; exit 1; }
          fi

      # (b) With the fixture configuration the checker passes and the Release build succeeds. Until Jalen commits the
      # real Setapp key (J14), the fixture key is copied in before generation and deleted afterwards.
      - name: Fixture Release build
        run: |
          set -o pipefail
          fixture=scripts/tests/fixtures/commercial/valid.xcconfig
          pem=Config/Setapp/setappPublicKey.pem
          copied=0
          if [ "$FLAVOR" = "setapp" ] && [ ! -f "$pem" ]; then
            cp scripts/tests/fixtures/commercial/setappPublicKey.pem "$pem"
            copied=1
          fi
          xcodegen generate --spec "project-$FLAVOR.yml"
          build_status=0
          scripts/check_commercial_config.sh --flavor "$FLAVOR" --configuration Release --xcconfig "$fixture" &&
          xcodebuild \
            -project "$PROJECT" \
            -scheme Otto \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "build/release-fixture-$FLAVOR" \
            -clonedSourcePackagesDirPath build/spm \
            -xcconfig "$fixture" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build || build_status=$?
          if [ "$copied" -eq 1 ]; then
            rm -f "$pem"
            xcodegen generate --spec "project-$FLAVOR.yml"
          fi
          exit "$build_status"

      - name: Audit the fixture Release product
        run: scripts/audit_flavor.sh --flavor "$FLAVOR" "build/release-fixture-$FLAVOR/Build/Products/Release/Otto.app"

      - name: The tree is still clean
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  # Otto for iPhone (project-ios.yml): the app, its widget extension and the unit tests on the newest iPhone
  # simulator the image has. The snapshot test renders the app's screens into build/ios-snapshots, kept as an
  # artifact so a change to the UI can be looked at without a Mac.
  ios:
    name: iOS app
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate OttoiOS.xcodeproj and check the tree stays clean
        run: |
          xcodegen generate --spec project-ios.yml
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.rsplit(".iOS-", 1)[1].split("-"))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      key = (version, "Pro" in device["name"], device["name"])
                      if best is None or key > best[0]:
                          best = (key, device["udid"])
          print(best[1] if best else "")
          ')
          test -n "$udid" || { echo "No iPhone simulator is available."; exit 1; }
          xcrun simctl list devices | grep "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p build/ios-snapshots
          # Keep compiling after the first error, so one run reports every file that fails.
          TEST_RUNNER_OTTO_SNAPSHOT_DIR="$PWD/build/ios-snapshots" xcodebuild \
            -project OttoiOS.xcodeproj \
            -scheme OttoiOS \
            -configuration Debug \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build/ios \
            -resultBundlePath build/iOSTestResults.xcresult \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee build/ios-build.log

      - name: Summarize build errors
        if: failure()
        run: |
          grep -E ": error: |Test Case .* failed" build/ios-build.log | sort -u | head -300 || true

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-snapshots
          path: build/ios-snapshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iOSTestResults
          path: build/iOSTestResults.xcresult
          retention-days: 7
