name: Feature request
description: Suggest an idea to make Otto more useful.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check the [roadmap](https://github.com/jke48222/otto#roadmap) and existing issues first; your idea may already be on the way.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or moment where Otto could help. The "why" matters more than the "how".
      placeholder: When I'm reading a long email, I want to ask about just the paragraph I selected…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like it to work?
      description: Walk us through what you'd see and do. Sketches and mockups are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you use today, or other ways this could work.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Opening and closing the notch
        - Attachments and context
        - Answers and formatting
        - Models and settings
        - Keyboard shortcuts
        - Privacy and permissions
        - Something else
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be interested in helping build this.
