name: Otto
options:
  bundleIdPrefix: com.jalenedusei
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Otto:
    type: application
    platform: macOS
    sources:
      - path: Otto
    info:
      path: Otto/Info.plist
      properties:
        CFBundleName: Otto
        CFBundleDisplayName: Otto
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: "Otto reads the title and address of your current browser tab so you can ask about the page you're looking at."
        NSHumanReadableCopyright: "© 2026 Jalen Edusei. Released under the MIT License."
    entitlements:
      path: Otto/Otto.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jalenedusei.otto
        PRODUCT_NAME: Otto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  OttoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OttoTests
    dependencies:
      - target: Otto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jalenedusei.otto.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Otto.app/Contents/MacOS/Otto"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Otto:
    build:
      targets:
        Otto: all
        OttoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OttoTests
